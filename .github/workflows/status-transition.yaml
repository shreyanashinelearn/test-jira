name: Enforce Status Transition (open-in-progress)

on:
  issues:
    types:
      - opened
      - edited
      - closed
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number for manual run (optional)'
        required: false
        default: ''

permissions:
  contents: read
  issues: read
  repository-projects: write

jobs:
  enforce-status:
    runs-on: ubuntu-latest

    steps:
      - name: Validate status transition
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            script: |
            let issue = context.payload.issue;

            // Handle manual trigger
            if (!issue) {
              const inputs = (context.payload && context.payload.inputs) || {};
              const inputNumber = inputs.issue_number || '';
              if (inputNumber) {
                issue = { number: parseInt(inputNumber, 10) };
                console.log(`Using issue number: ${issue.number}`);
              } else {
                console.log("No issue context. Exiting.");
                return;
              }
            }

            const PROJECT_ID = "PVT_kwDOEp-UH84BfO4c";
            const STATUS_FIELD_ID = "PVTSSF_lADOEp-UH84BfO4czhZjNrU";

            // Status IDs
            const STATUS = {
              OPEN: "1716c862",
              IN_PROGRESS: "f7fade2b",
              IN_REVIEW: "b10307a0",
              TESTING: "c8a33234",
              DONE: "98236657"
            };

            // Strict order
            const FLOW = [
              STATUS.OPEN,
              STATUS.IN_PROGRESS,
              STATUS.IN_REVIEW,
              STATUS.TESTING,
              STATUS.DONE
            ];

            async function updateStatus(itemId, optionId) {
              const mutation = `
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: { singleSelectOptionId: $optionId }
                    }
                  ) {
                    projectV2Item { id }
                  }
                }
              `;

              await github.graphql(mutation, {
                projectId: PROJECT_ID,
                itemId,
                fieldId: STATUS_FIELD_ID,
                optionId
              });
            }

            async function getProjectItem(issueNumber) {
              const query = `
                query($owner: String!, $repo: String!, $issueNumber: Int!) {
                  repository(owner: $owner, name: $repo) {
                    issue(number: $issueNumber) {
                      projectItems(first: 20) {
                        nodes {
                          id
                          project { id }
                          fieldValueByName(name: "Status") {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              optionId
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `;

              const result = await github.graphql(query, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issueNumber
              });

              return result.repository.issue.projectItems.nodes.find(
                item => item.project.id === PROJECT_ID
              );
            }

            async function processIssue(issueNumber) {
              const item = await getProjectItem(issueNumber);

              if (!item) {
                console.log(`Issue #${issueNumber} not in project`);
                return;
              }

              const current = item.fieldValueByName?.optionId;
              const name = item.fieldValueByName?.name;

              console.log(`Issue #${issueNumber} current: ${name}`);

              // No status → set OPEN
              if (!current) {
                console.log("No status → setting OPEN");
                await updateStatus(item.id, STATUS.OPEN);
                return;
              }

              const index = FLOW.indexOf(current);

              // Invalid status → reset
              if (index === -1) {
                console.log("Invalid status → reset to OPEN");
                await updateStatus(item.id, STATUS.OPEN);
                return;
              }

              // ❌ Prevent skipping (e.g., OPEN → TESTING / DONE)
              if (index > 1) {
                console.log("Skipped stages → reverting to previous");

                const previous = FLOW[index - 1];
                await updateStatus(item.id, previous);
                return;
              }

              console.log("Valid status");
            }

            await processIssue(issue.number);
