name: Enforce Status Transition

on:
  issues:
    types: [opened, edited]
  schedule:
    - cron: "*/5 * * * *"   # every 5 mins (for project changes)
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  repository-projects: write

jobs:
  enforce-status:
    runs-on: ubuntu-latest

    steps:
      - name: Validate status transition
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |

            const PROJECT_ID = "PVT_kwDOEp-UH84BfO4c";
            const STATUS_FIELD_ID = "PVTSSF_lADOEp-UH84BfO4czhZjNrU";

            const STATUS_FLOW = ["OPEN","IN_PROGRESS","IN_REVIEW","TESTING","DONE"];

            const STATUS_MAP = {
              OPEN: "1716c862",
              IN_PROGRESS: "f7fade2b",
              IN_REVIEW: "b10307a0",
              TESTING: "c8a33234",
              DONE: "98236657"
            };

             const ALLOWED_TRANSITIONS = {
              [STATUS_MAP.OPEN]: [STATUS_MAP.IN_PROGRESS],
              [STATUS_MAP.IN_PROGRESS]: [STATUS_MAP.IN_REVIEW],
              [STATUS_MAP.IN_REVIEW]: [STATUS_MAP.TESTING],
              [STATUS_MAP.TESTING]: [STATUS_MAP.DONE],
              [STATUS_MAP.DONE]: []
            };

            async function getProjectItem(issueNumber) {
              const query = `
                query($owner: String!, $repo: String!, $issueNumber: Int!) {
                  repository(owner: $owner, name: $repo) {
                    issue(number: $issueNumber) {
                      projectItems(first: 20) {
                        nodes {
                          id
                          project { id }
                          fieldValueByName(name: "Status") {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              optionId
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `;

              const result = await github.graphql(query, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issueNumber
              });

              return result.repository.issue.projectItems.nodes.find(
                item => item.project.id === PROJECT_ID
              );
            }

            async function updateStatus(itemId, newStatus) {
              const mutation = `
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: { singleSelectOptionId: $optionId }
                    }
                  ) {
                    projectV2Item { id }
                  }
                }
              `;

              await github.graphql(mutation, {
                projectId: PROJECT_ID,
                itemId,
                fieldId: STATUS_FIELD_ID,
                optionId: newStatus
              });
            }

            async function processIssue(issueNumber) {
              const item = await getProjectItem(issueNumber);

              if (!item) {
                console.log(`Issue #${issueNumber} not in project`);
                return;
              }

              const current = item.fieldValueByName?.optionId;

              console.log(`Issue #${issueNumber} current: ${current}`);

              if (!current) {
                console.log("No status → setting OPEN");
                await updateStatus(item.id, STATUS_MAP.OPEN);
                return;
              }

              if (!(current in ALLOWED_TRANSITIONS)) {
                console.log("Invalid state → resetting to OPEN");
                await updateStatus(item.id, STATUS_MAP.OPEN);
                return;
              }

              const allowedNext = ALLOWED_TRANSITIONS[current];

              if (allowedNext.length === 0) {
                console.log("Already DONE");
                return;
              }
            }

            // EVENT HANDLER
            if (context.eventName === "issues") {
              if (!context.payload.issue) {
                console.log("No issue context");
                return;
              }
              await processIssue(context.payload.issue.number);
            } else {
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open"
              });

              for (const issue of issues.data) {
                await processIssue(issue.number);
              }
            }
